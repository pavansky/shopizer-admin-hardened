name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "14"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node --max_old_space_size=6144 ./node_modules/@angular/cli/bin/ng build --prod
